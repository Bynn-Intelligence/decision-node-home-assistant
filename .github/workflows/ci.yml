# Validates the integration on every push and pull request: Home Assistant's own
# manifest and structure check (hassfest), the HACS repository check, and the tests
# against a mocked DecisionNode API. Every action is pinned to a commit SHA, with its
# version in the comment, and no checkout keeps its credentials.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@50baf3a307f87100cf550d4ae127746595030d5d # master, 2026-10-12

  # HACS reads the manifest and hacs.json from the public file host, so this check can
  # only pass on a public repository; while the repository is private it is skipped.
  hacs:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt
      - run: python -m pytest -q
